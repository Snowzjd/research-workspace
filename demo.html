    .graph-stage{background:radial-gradient(ellipse at 49% 47%,var(--p-card) 0,var(--p-canvas) 68%,var(--p-soft) 100%)}
    .graph-tip{background:var(--p-raised)}

    .top-actions{gap:8px}
    .brand .mark{color:var(--p-onaccent)}
    .btn.primary:hover{filter:brightness(.93)}
    .nav-btn.active{color:var(--p-link)}
    #toast{color:var(--p-link)}

        --rose-ink:#803f5b;--rose-soft:#fde2e8;--rose-line:#eab4c6;--rose-canvas:#fde2e8;
        --blue-border:#c0d8ee;--blue-wash:#cfe4f6;--blue-hover:#a9d6ff;
    }
    [data-theme="warm"] .nav-btn.active,
    [data-theme="warm"] .project-btn.active,
    [data-theme="warm"] .file.active,
    [data-theme="warm"] .seg button.active{background:var(--rose-soft);color:var(--rose-ink)}
    [data-theme="warm"] .nav-btn.active{box-shadow:inset 2px 0 var(--rose-ink)}
    [data-theme="warm"] .tab.active{color:var(--rose-ink);border-color:var(--rose-ink)}
    [data-theme="warm"] .legend button.selected{color:var(--rose-ink)}
    [data-theme="warm"] .graph-stage{
        background:radial-gradient(ellipse at 6% 8%,var(--rose-canvas),transparent 48%),
                   radial-gradient(ellipse at 94% 100%,var(--p-bluetint),transparent 66%),
                   var(--p-canvas)
    }
    [data-theme="warm"] .mini,[data-theme="warm"] .editor-bar{background:var(--p-bluetint)}
    [data-theme="warm"] .rendered blockquote{background:var(--p-quote);border-color:var(--rose-line)}
    [data-theme="warm"] .section-tag,[data-theme="warm"] .textbtn,
    [data-theme="warm"] .pill.mint,[data-theme="warm"] .side-foot strong{color:var(--p-link)}
    [data-theme="warm"] .input-wrap:focus-within{border-color:var(--rose-line)}
    [data-theme="warm"] :focus-visible{outline-color:var(--p-link)}
    [data-theme="warm"] .btn:not(.primary):not(.ghost),[data-theme="warm"] .icon-box{
        background:var(--p-bluetint);color:var(--p-blue);border-color:var(--blue-border)
    }
    [data-theme="warm"] .btn:not(.primary):not(.ghost):hover{background:var(--blue-hover);border-color:var(--blue-border)}
    [data-theme="warm"] .pill.blue{background:var(--blue-wash);border-color:var(--blue-border)}
    [data-theme="warm"] .avatar{background:var(--blue-wash);border-color:var(--blue-border)}

function splitMd(md){
 const front=md.match(/^(?:\uFEFF)?---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/);
 return front?{yaml:front[1],body:md.slice(front[0].length)}:{yaml:'',body:md};
}
function frontProps(yaml){

}

function writtenLinks(markdown){

 return [...new Set([...clean.matchAll(/\[\[([^\]\n]+)\]\]/g)].map(m=>resolveLink(m[1])?.id).filter(Boolean))];
}

function currentNetwork(){

 }
 return [...groups].map(([folder,notes])=>'<details '+(query||notes.some(n=>n.id===state.noteId)?'open':'')+'><summary>'+esc(folder)+'</summary>'+
  notes.map(n=>'<button class="file '+(n.id===state.noteId?'active':'')+'" title="'+esc(n.title)+'.md" '+actionPage('notes',n.id)+'>'+icon('notes')+'<span>'+esc(n.title)+'.md</span></button>').join('')+'</details>').join('')||'<div class="blank">找不到笔记</div>';
}
function notesPage(){
 const n=NOTES.get(state.noteId),view=state.notesView;
 return head('KNOWLEDGE STUDIO','知识工作区','在同一处查阅、编辑并关联示例 Markdown 笔记。',reviewBack()+button('查看笔记图谱','data-locate="'+n.id+'"','graph'))+
 '<section class="card workspace"><aside class="files" aria-label="文件树"><div class="inspect-title"><div class="row">'+icon('projects')+'笔记目录</div></div><div class="file-filter">'+input('查找笔记','id="file-search"')+'</div><div class="tree" id="file-tree">'+filesTree()+'</div></aside>'+
 '<div class="studio"><div class="editor-bar"><div class="row"><strong>'+esc(n.title)+'.md</strong><span class="muted small" id="save-state"></span></div><div class="row"><div class="seg">'+['编辑','分栏','阅读'].map(v=>'<button class="'+(view===v?'active':'')+'" aria-pressed="'+(view===v)+'" data-note-view="'+v+'">'+v+'</button>').join('')+'</div>'+button('保存','id="save-note" data-save','save','primary')+'</div></div>'+
 '<div class="edit-grid '+(view==='分栏'?'':'single')+'">'+
 (view!=='阅读'?'<div class="source"><div class="pane-label">MARKDOWN 源文</div><textarea id="markdown-source" aria-label="Markdown 源文" spellcheck="false">'+esc(noteText(n.id))+'</textarea></div>':'')+
 (view!=='编辑'?'<div class="preview"><div class="pane-label">阅读预览</div><article class="rendered" id="markdown-preview"></article></div>':'')+
 '</div></div><aside class="properties" aria-label="笔记属性和链接"><div class="inspect-title"><div class="row">'+icon('notes')+'YAML 属性</div></div><div id="note-props"></div></aside></section>';
}
marked.use({
 renderer:{html(){return ''},image(token){return esc(token.text||'图片引用')}},
 extensions:[{
  name:'wikilink',level:'inline',
  start(src){return src.indexOf('[[')},
  tokenizer(src){const m=src.match(/^\[\[([^\]\n]+)\]\]/);if(m)return {type:'wikilink',raw:m[0],target:m[1]}},
  renderer(token){
   const candidate=resolveLink(token.target),label=token.target.split('|').at(-1);
   return candidate?'<button class="wikilink textbtn" title="打开笔记" '+actionPage('notes',candidate.id)+'>'+esc(label)+'</button>':'<span class="unresolved" title="演示库中没有此笔记">'+esc(token.raw)+'</span>';
  }
 }]
});
function refreshNote(){
 const n=NOTES.get(state.noteId),content=noteText(n.id),parts=splitMd(content);
 const markedPreview=$('#markdown-preview');
 if(markedPreview)markedPreview.innerHTML=DOMPurify.sanitize(marked.parse(parts.body,{gfm:true}),{FORBID_TAGS:['img','iframe','form'],FORBID_ATTR:['href','src','srcset']});
 const props=frontProps(parts.yaml);
 const backlinks=DATA.notes.filter(m=>m.id!==n.id&&writtenLinks(noteText(m.id)).includes(n.id));
 const outgoing=writtenLinks(content).map(id=>NOTES.get(id)).filter(Boolean);
 const noteList=items=>items.map(m=>'<button class="neighbor" '+actionPage('notes',m.id)+'><span>'+icon('notes')+esc(m.title)+'</span></button>').join('')||'<small>暂无链接</small>';
 $('#note-props').innerHTML='<div class="prop-list">'+(props.map(([key,value])=>'<div class="prop-row"><span class="muted">'+esc(key)+'</span><span>'+esc(value)+'</span></div>').join('')||'<span class="small muted">暂无可显示的属性</span>')+'</div>'+
 '<div class="prop-section"><h3>反向链接 · '+backlinks.length+'</h3>'+noteList(backlinks)+'</div><div class="prop-section"><h3>出链 · '+outgoing.length+'</h3>'+noteList(outgoing)+'</div>';
 const unsaved=content!==savedText(n.id);
 $('#save-note').disabled=!unsaved;
 $('#save-state').textContent=unsaved?'未保存':state.saved[n.id]!==undefined?'已保存':'示例笔记';
}
function saveNote(){
 if(noteText(state.noteId)===savedText(state.noteId))return;
 state.saved[state.noteId]=noteText(state.noteId);delete state.draft[state.noteId];
 const success=persist();
 refreshNote();toast(success?'已保存到此浏览器的演示数据':'已保存到本次会话，浏览器存储不可用');
}
function searchAll(){
 const q=$('#command-input').value.trim().toLowerCase();
 const terms=DATA.nodes.filter(n=>!q?n.type==='project'||NOTES.has(n.id):[n.label,n.summary,n.id].some(x=>String(x).toLowerCase().includes(q))||(NOTES.has(n.id)&&savedText(n.id).toLowerCase().includes(q))).slice(0,10);
 $('#command-results').innerHTML=terms.length?terms.map(n=>{
  const attrs=NOTES.has(n.id)?actionPage('notes',n.id):PROJECT.has(n.id)?actionPage('project',n.id):TASKS.has(n.id)?'data-task="'+n.id+'"':MATERIALS.has(n.id)?'data-material="'+n.id+'"':'data-locate="'+n.id+'"';
  return '<button class="list-row" '+attrs+'><span class="icon-box">'+dot(TYPES[n.type][1])+'</span><div><strong>'+esc(n.label)+'</strong><small>'+TYPES[n.type][0]+' · '+esc(projectName(n.project))+'</small></div>'+icon('chevron')+'</button>';
 }).join(''):'<div class="blank">找不到匹配的演示记录</div>';
}
function command(){
 dialog('搜索演示工作区',input('搜索项目、笔记、任务或材料','id="command-input" autocomplete="off"')+'<div id="command-results" class="list" style="margin-top:8px"></div>');
 searchAll();$('#command-input').focus();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!b)return;
 const d=b.dataset;
 if(d.reviewFrom&&state.review?.task!==d.reviewFrom){
  state.review={task:d.reviewFrom,route:state.route,id:state.id,tab:state.tab};
 }
 if(d.reviewBack!==undefined){
  const origin=state.review;
  if(!origin)return;
  state.review=null;
  $('#dialog').close();
  go(origin.route,origin.id,origin.tab);
  showTask(origin.task);
  return;
 }
 if(d.route){
  if(b.closest('.side nav'))state.review=null;
  if($('#dialog').open)$('#dialog').close();
  if(d.route==='graph')Object.assign(state.graph,{selected:null,type:'',project:'',relation:'',query:'',hops:1});
  go(d.route,d.id||'');return;
 }
 if(d.close!==undefined){$('#dialog').close();return}
 if(d.command!==undefined){command();return}
 if(d.task){showTask(d.task);return}
 if(d.material){showMaterial(d.material);return}
 if(d.tab){state.tab=d.tab;render();return}
 if(d.activityView){state.activity.view=d.activityView;render();return}
 if(d.projectGraph||d.cluster){
  Object.assign(state.graph,{project:d.projectGraph||d.cluster,type:'',relation:'',selected:d.projectGraph||d.cluster,query:'',hops:1});
  go('graph');return;
 }
 if(d.locate){if($('#dialog').open)$('#dialog').close();showInGraph(d.locate);return}
 if(d.pick){
  $('#graph-suggest').hidden=true;
  selectNode(d.pick);return;
 }
 if(d.clearNode!==undefined){selectNode(null,false);return}
 if(d.hops!==undefined){state.graph.hops=state.graph.hops===1?2:1;graphSession.draw();refreshInspector();return}
 if(d.zoom){if(d.zoom==='fit')graphSession.fit();else graphSession.zoom(d.zoom==='in'?1.24:1/1.24);return}
 if(d.resetGraph!==undefined){
  Object.assign(state.graph,{project:'',type:'',relation:'',selected:null,query:'',hops:1});render();return;
 }
 if(d.legend){
  state.graph.type=state.graph.type===d.legend?'':d.legend;
  $('[data-graph-filter="type"]').value=state.graph.type;mountGraph();return;
 }
 if(d.noteView){state.notesView=d.noteView;render();return}
 if(d.save!==undefined)saveNote();
});
document.addEventListener('change',e=>{
 const el=e.target,d=el.dataset;
 if(el.id==='palette'){
  theme=el.value;
  document.documentElement.dataset.theme=theme;
  try{localStorage.setItem(STORE+'-theme',theme)}catch{}
  (graphSession||paletteCanvas)?.draw();
  return;
 }
 if(d.graphFilter){state.graph[d.graphFilter]=el.value;mountGraph();$('#graph-suggest').hidden=true;return}
 if(d.materialFilter){state.materials[d.materialFilter]=el.value;refreshMaterials();return}
 if(d.activityFilter){state.activity[d.activityFilter]=el.value;refreshActivity();return}
 if(d.taskState){
  state.taskStatus[d.taskState]=el.value;
  const success=persist();render();showTask(d.taskState);
  toast(success?'已更新演示任务状态':'状态已更新，保存范围为本次会话');
 }
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='graph-search'){state.graph.query=el.value;graphSuggest()}
 if(el.id==='markdown-source'){state.draft[state.noteId]=el.value;refreshNote()}
 if(el.id==='file-search')$('#file-tree').innerHTML=filesTree(el.value);
 if(el.id==='material-search'){state.materials.query=el.value;refreshMaterials()}
 if(el.id==='command-input')searchAll();
});
document.addEventListener('pointerdown',e=>{
 if(!e.target.closest('.input-wrap')&&$('#graph-suggest'))$('#graph-suggest').hidden=true;
});
document.addEventListener('keydown',e=>{
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();command()}
 if(mod&&e.key.toLowerCase()==='s'&&state.route==='notes'){e.preventDefault();saveNote()}
 if(e.target.id==='graph-search'){
  if(e.key==='Escape')$('#graph-suggest').hidden=true;
  if(e.key==='Enter'){
   const top=graphChoices()[0];
   if(top){e.preventDefault();$('#graph-suggest').hidden=true;selectNode(top.id)}
  }
 }
 if(e.target.id==='command-input'&&e.key==='Enter'){e.preventDefault();$('#command-results button')?.click()}
});
window.addEventListener('popstate',()=>routeTo(location.hash));
routeTo(location.hash);

</script>
</body>
</html>
